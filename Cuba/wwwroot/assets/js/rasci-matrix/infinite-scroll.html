<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scroll Tabel (X & Y)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .table-container {
            width: 100vw;
            height: 80vh;
            overflow: auto;
            /* Scrollable */
            border: 2px solid black;
        }

        table {
            width: max-content;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
            min-width: 150px;
        }

        th {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h1 style="text-align: center;">Infinite Scroll pada Tabel (X & Y)</h1>
    <div class="table-container">
        <table id="data-table">
            <thead>
                <tr id="header-row">
                    <th>ID</th>
                    <th>Judul</th>
                    <th>Isi</th>
                    <th>User ID</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const tableBody = document.querySelector("#data-table tbody");
            const tableContainer = document.querySelector(".table-container");
            const headerRow = document.querySelector("#header-row");

            let page = 1; // Halaman API
            let columnPage = 1; // Halaman untuk tambahan kolom
            const limit = 10; // Data per batch
            let isLoadingY = false; // Scroll ke bawah
            let isLoadingX = false; // Scroll ke kanan
            let extraColumns = 0; // Hitung jumlah kolom tambahan

            // Fungsi untuk mengambil data baris dari API
            async function fetchRows() {
                if (isLoadingY) return;
                isLoadingY = true;

                try {
                    const response = await fetch(
                        `https://jsonplaceholder.typicode.com/posts?_page=${page}&_limit=${limit}`);
                    const data = await response.json();

                    if (data.length > 0) {
                        renderRows(data);
                        page++;
                    }
                } catch (error) {
                    console.error("Gagal mengambil data baris:", error);
                }

                isLoadingY = false;
            }

            // Fungsi untuk mengambil data kolom tambahan dari API
            async function fetchColumns() {
                if (isLoadingX) return;
                isLoadingX = true;

                try {
                    const response = await fetch(
                        `https://jsonplaceholder.typicode.com/comments?_page=${columnPage}&_limit=${limit}`
                        );
                    const data = await response.json();

                    if (data.length > 0) {
                        renderColumns(data);
                        columnPage++;
                    }
                } catch (error) {
                    console.error("Gagal mengambil data kolom:", error);
                }

                isLoadingX = false;
            }

            // Fungsi untuk menambahkan data ke dalam tabel (baris)
            function renderRows(data) {
                data.forEach(item => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${item.id}</td>
                        <td>${item.title}</td>
                        <td>${item.body.substring(0, 50)}...</td>
                        <td>${item.userId}</td>
                    `;

                    // Tambahkan kolom tambahan jika sudah ada
                    for (let i = 0; i < extraColumns; i++) {
                        row.innerHTML += `<td>Loading...</td>`;
                    }

                    tableBody.appendChild(row);
                });
            }

            // Fungsi untuk menambahkan kolom baru dari API
            function renderColumns(data) {
                extraColumns++;

                // Tambahkan header kolom baru
                const th = document.createElement("th");
                th.textContent = `Detail ${extraColumns}`;
                headerRow.appendChild(th);

                // Tambahkan data ke setiap baris yang sudah ada
                const rows = document.querySelectorAll("#data-table tbody tr");
                rows.forEach((row, index) => {
                    const td = document.createElement("td");
                    td.textContent = data[index] ? data[index].email : "N/A";
                    row.appendChild(td);
                });
            }

            // Load data pertama kali
            fetchRows();

            // Event listener untuk infinite scroll
            tableContainer.addEventListener("scroll", function () {
                const bottomReached = tableContainer.scrollTop + tableContainer.clientHeight >=
                    tableContainer.scrollHeight - 10;
                const rightReached = tableContainer.scrollLeft + tableContainer.clientWidth >=
                    tableContainer.scrollWidth - 10;

                if (bottomReached) {
                    fetchRows(); // Ambil data baru saat scroll ke bawah
                }

                if (rightReached) {
                    fetchColumns(); // Ambil data baru saat scroll ke kanan
                }
            });
        });
    </script>

</body>

</html>
